name: 每日更新基金评分（方案B-A：核心评分）

# =====================================================================
# 方案 B 拆分后的「核心评分流水线 A」
#
# 痛点：原 update-fund-data.yml 把 finalize 的 needs 绑死在
#   allocation-shard + quarterly-score 上。这两个 job 抓取第三方
#   （东财F10 / 季度净值）经常假死（8/9、8/11、run #81），导致
#   finalize 永远等不到 → 生产 fund_scores 永不更新、收益冻结。
#
# 本流水线 A 只负责「收益 + 风险指标 → staging → 原子切换生产」，
# finalize 的 needs 仅 [prep]，不再等待任何会假死的外部抓取。
# 资产配置/季度评分已拆到 update-allocation-quarterly.yml（流水线 B），
# 互不影响：A 每天稳定提升评分；B 失败也只是配置列/季度分不刷新，
# 不会拖垮评分更新。
#
# 结构：
#   prep           —— 步骤1~3（天天基金抓取 + 风险指标 + 写入 staging）
#   finalize       —— promote_staging.py --skip-combined
#                     （仅切换 fund_scores；不重建 fund_combined，
#                       combined 重建交给流水线 B 的 rebuild-combined）
#   post-finalize  —— 步骤3d~5h 轻量收尾（依赖 finalize）
#   deploy         —— 前端构建 + 部署 EdgeOne（needs post-finalize，if always()）
#
# 关键保护：promote_staging 对 12 配置列 + 8 基本信息列做 COALESCE
# 备份回填，即使 staging 不含资产配置数据，生产配置列也不会被清空。
# =====================================================================

on:
  # 定时触发：北京时间每天 21:30（UTC 13:30）。
  schedule:
    - cron: '30 13 * * *'
  # 手动触发
  workflow_dispatch:
    inputs:
      skip_risk:
        description: '跳过风险指标计算（仅更新收益排位靠谱分）'
        required: false
        type: boolean
        default: false
      full_basic_info:
        description: '全量抓取基金基本概况（fundf10 jbgk，首次回填用）'
        required: false
        type: boolean
        default: false

env:
  PYTHONUNBUFFERED: '1'

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  # ───────────────────────────────────────────────────────────────
  # prep：步骤1~3，产出 fund_scores_staging（含评分）。不含配置/季度抓取。
  # ───────────────────────────────────────────────────────────────
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖（psycopg2 直连驱动 + requests）
        run: pip install psycopg2-binary requests

      - name: 验证环境变量
        run: |
          if [ -z "$SUPABASE_DB_URL" ] && [ -z "$SUPABASE_MGMT_TOKEN" ]; then
            echo "ERROR: 需要 SUPABASE_DB_URL 或 SUPABASE_MGMT_TOKEN 其中之一（建议配置 SUPABASE_DB_URL 直连，永不过期）。"
            exit 1
          fi
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "直连数据库(SUPABASE_DB_URL)已配置 ✓ —— 不再依赖会过期的 PAT"
          else
            echo "WARNING: 仅配置 SUPABASE_MGMT_TOKEN(PAT)，该 token 会过期，建议改为 SUPABASE_DB_URL 直连"
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY 未设置！请在 GitHub Secrets 中配置。"
            exit 1
          fi
          echo "Supabase URL: $SUPABASE_URL"
          echo "Project Ref: $SUPABASE_PROJECT_REF"
          echo "MGMT_TOKEN 已配置: ${#SUPABASE_MGMT_TOKEN} 字符"
          echo "ANON_KEY 已配置: ${#SUPABASE_ANON_KEY} 字符"

      - name: 步骤1 — 拉取天天基金全量数据（输出 NDJSON）
        run: |
          echo "============================================"
          echo "  步骤1: 拉取天天基金 + 计算收益靠谱分"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          python scripts/fetch_and_import_funds.py --output-only

      - name: 步骤2 — 抓取风险指标（回撤+夏普，pingzhongdata HTTPS，4 进程分批并行）
        if: ${{ !inputs.skip_risk }}
        id: risk_indicators
        timeout-minutes: 60
        continue-on-error: true
        run: |
          echo "============================================"
          echo "  步骤2: 抓取风险指标 (回撤+夏普比率) — 4 进程分批并行"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          if [ ! -f scripts/funds_output.ndjson ]; then
            echo "未找到 funds_output.ndjson，跳过风险指标计算"
            exit 0
          fi
          mkdir -p scripts/_risk_chunks
          split -n l/4 -d --additional-suffix=.ndjson scripts/funds_output.ndjson scripts/_risk_chunks/part_
          echo "已切分为以下分片:"
          ls -1 scripts/_risk_chunks/
          for f in scripts/_risk_chunks/part_*.ndjson; do
            python scripts/fetch_risk_indicators.py \
              --input "$f" \
              --output "${f%.ndjson}.out.ndjson" \
              --workers 6 --delay 0.25 --resume &
          done
          wait
          echo "各分片完成，合并输出到 risk_indicators.ndjson ..."
          cat scripts/_risk_chunks/part_*.out.ndjson > scripts/risk_indicators.ndjson
          echo "合并后记录数: $(wc -l < scripts/risk_indicators.ndjson)"
          rm -rf scripts/_risk_chunks
          echo "风险指标计算完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤2a — 补充风险指标（tsdata 页面夏普比率+标准差）
        if: ${{ !inputs.skip_risk }}
        timeout-minutes: 15
        continue-on-error: true
        run: |
          echo "============================================"
          echo "  步骤2a: 补充风险指标 (tsdata 页面)"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          if [ ! -f scripts/risk_indicators.ndjson ]; then
            echo "未找到 risk_indicators.ndjson，跳过 tsdata 补充"
            exit 0
          fi
          python scripts/fetch_tsdata_risk.py \
            --input scripts/risk_indicators.ndjson \
            --output scripts/risk_indicators.ndjson \
            --workers 5 \
            --delay 0.3
          echo "tsdata 补充完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤2b — 抓取成立以来收益率（rankhandler API）
        if: ${{ !inputs.skip_risk }}
        timeout-minutes: 10
        continue-on-error: true
        run: |
          echo "============================================"
          echo "  步骤2b: 抓取成立以来收益率 (rankhandler API)"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          python scripts/fetch_return_all.py scripts/return_all.ndjson 0.3
          echo "成立以来收益率抓取完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤2c — 导出基金详情（公司/规模/费率）
        if: ${{ !inputs.skip_risk }}
        timeout-minutes: 5
        run: |
          echo "============================================"
          echo "  步骤2c: 导出基金详情 (公司/规模/费率)"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          pip install requests
          python scripts/export_fund_details.py scripts/fund_details.ndjson
          echo "基金详情导出完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤2c2 — 抓取基金基本概况（fundf10 jbgk：基金经理/管理人/分类/费率）
        if: ${{ !inputs.skip_risk }}
        timeout-minutes: 240
        continue-on-error: true
        run: |
          echo "============================================"
          echo "  步骤2c2: 抓取基金基本概况 (fundf10 jbgk)"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          pip install requests
          if [ "${{ inputs.full_basic_info }}" = "true" ]; then
            echo "[INFO] 全量模式：抓取全部基金基本概况"
            python scripts/fetch_fund_basic_info.py --full --workers 4 --delay 0.2 --output scripts/fund_basic_info.ndjson
          else
            echo "[INFO] 补缺模式：仅抓取缺失基金经理/管理人/分类/份额/费率/成立日期的基金"
            python scripts/fetch_fund_basic_info.py --workers 4 --delay 0.2 --output scripts/fund_basic_info.ndjson
          fi
          echo "基金基本概况抓取完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤2d — 抓取货币基金阶段收益（hb rankhandler → currency_output.ndjson）
        if: ${{ !inputs.skip_risk }}
        timeout-minutes: 10
        run: |
          echo "============================================"
          echo "  步骤2d: 抓取货币基金阶段收益 (hb rankhandler)"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          pip install requests
          python scripts/fetch_currency_funds.py --output scripts/currency_output.ndjson
          echo "货币阶段收益抓取完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤2c3 — 确保 fund_scores 新列存在（DDL）
        if: ${{ !inputs.skip_risk }}
        run: |
          echo "============================================"
          echo "  步骤2c3: 确保 fund_scores 新增列 (share_scale/custody_fee/sale_fee/found_date)"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          pip install requests
          python scripts/ensure_basic_info_columns.py
          echo "DDL 检查完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤3 — 合并风险指标 + 重算靠谱分 + 写入临时表 fund_scores_staging
        if: ${{ !inputs.skip_risk }}
        run: |
          echo "============================================"
          echo "  步骤3: 合并风险指标 + 重算靠谱分 + 写入 STAGING"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          if [ "${{ steps.risk_indicators.outcome }}" = "failure" ]; then
            echo "[WARN] 风险指标抓取超时/失败，跳过合并，仅使用收益靠谱分"
          fi
          python scripts/import_via_rest.py --staging

      - name: 数据更新通知
        if: ${{ failure() || cancelled() }}
        run: |
          echo "prep job 失败或被取消！请检查 GitHub Actions 日志。"
          echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"

  # ───────────────────────────────────────────────────────────────
  # finalize：校验 + 原子切换（仅 fund_scores，跳过 combined 重建）
  # ───────────────────────────────────────────────────────────────
  finalize:
    needs: [prep]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖（psycopg2 直连驱动 + requests）
        run: pip install psycopg2-binary requests

      - name: 步骤3c2 — 校验临时表 + 原子切换 fund_scores（--skip-combined）
        run: |
          echo "============================================"
          echo "  步骤3c2: 校验 staging + 原子切换 fund_scores（跳过 fund_combined 重建）"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "  说明: fund_combined 重建已由流水线 B(update-allocation-quarterly.yml)"
          echo "        的 rebuild-combined 步骤接管；本步仅切换 fund_scores，"
          echo "        配置列靠 COALESCE 备份回填保护。"
          echo "============================================"
          python scripts/promote_staging.py --skip-combined
          echo "切换完成: $(date '+%Y-%m-%d %H:%M:%S')"

  # ───────────────────────────────────────────────────────────────
  # post-finalize：步骤3d~5h 轻量收尾（依赖 finalize）
  # ───────────────────────────────────────────────────────────────
  post-finalize:
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖（psycopg2 直连驱动 + requests）
        run: pip install psycopg2-binary requests

      - name: 步骤3d — 基金经理空值回填与--标记
        continue-on-error: true
        run: |
          echo "============================================"
          echo "  步骤3d: 基金经理空值复核回填（jbgk 抓取，确无经理标记 --）"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "  说明: 读取 fund_scores/fund_combined 空经理基金，回源 fundf10 jbgk 复核；"
          echo "        抓到→回填(漏抓)；页面无经理→'--'(确无)；抓取失败→保留(瞬时限流)。"
          echo "============================================"
          pip install requests
          python scripts/fix_manager_blanks.py
          echo "基金经理回填完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤4 — 验证数据
        run: |
          echo "============================================"
          echo "  步骤4: 验证数据完整性"
          echo "  完成时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          python scripts/verify_update.py

      - name: 步骤4b — 数据质量校验（抽样验证 + 极端值检测）
        continue-on-error: true
        run: |
          echo "============================================"
          echo "  步骤4b: 数据质量校验"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          pip install requests
          python scripts/validate_fund_data.py --sample 30
          echo "校验完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤5 — 导出 fund_combined.xlsx
        run: |
          echo "============================================"
          echo "  步骤5: 导出 fund_combined.xlsx"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          pip install openpyxl requests
          python scripts/export_fund_combined.py --output public/fund_combined.xlsx
          echo "文件大小: $(ls -lh public/fund_combined.xlsx | awk '{print $5}')"
          echo "导出完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤5b — 导出全部数据表到数据中心
        run: |
          echo "============================================"
          echo "  步骤5b: 自动发现并导出全部数据库表到 public/downloads/"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          mkdir -p public/downloads
          python scripts/export_all_tables.py --output-dir public/downloads
          echo "导出完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤5c — 计算特色指标（恐惧贪婪/市场温度/基金发行热度）
        timeout-minutes: 15
        continue-on-error: true
        run: |
          echo "============================================"
          echo "  步骤5c: 计算特色指标（自建复合算法，写入 jqr_indicators 表）"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          pip install akshare
          python scripts/fetch_jqr_indicators.py
          echo "特色指标计算完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤5d — 拉取基金指数（腾讯源，写入 fund_indices 表）
        timeout-minutes: 10
        continue-on-error: true
        run: |
          echo "============================================"
          echo "  步骤5d: 拉取基金指数（上证/深证/国证基金指数等，腾讯源）"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          pip install akshare requests
          python scripts/fetch_fund_indices_em.py
          echo "基金指数更新完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤5e — 拉取自建组合场内基金区间收益（腾讯K线，写入 etf_returns 表）
        timeout-minutes: 10
        continue-on-error: true
        run: |
          echo "============================================"
          echo "  步骤5e: 拉取自建组合 ETF/LOF 区间收益（腾讯K线）"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          pip install requests
          python scripts/fetch_etf_returns.py
          echo "场内基金区间收益更新完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤5f — 拉取主题板块各周期涨跌幅（东财ZTJJ，写入 fund_tag_perf 表）
        timeout-minutes: 15
        continue-on-error: true
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
        run: |
          echo "============================================"
          echo "  步骤5f: 拉取主题板块日/周/月/季/年/今年涨跌幅（东财ZTJJ GetBKDetailInfoNew）"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          pip install requests
          python scripts/sync_tag_performance.py
          echo "主题板块涨跌幅更新完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤5g — 同步完整标签列表（东财ZTJJ，重建 fund_tags 表）
        timeout-minutes: 10
        continue-on-error: true
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
        run: |
          echo "============================================"
          echo "  步骤5g: 同步完整标签列表（东财ZTJJ GetBKListByBKTypeNew → fund_tags）"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          pip install requests
          python scripts/sync_fund_tags_full.py
          echo "标签列表同步完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤5h — 将标签关联的场内 ETF/LOF 补充进 fund_scores 主表
        timeout-minutes: 15
        continue-on-error: true
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
        run: |
          echo "============================================"
          echo "  步骤5h: 标签关联 ETF/LOF 补充进 fund_scores（统一数据源）"
          echo "  说明: promote_staging 仅重建 .OF 场外基金；本步把 fund_tag_funds 中缺失的"
          echo "        场内 ETF/LOF（及少量场外缺口）追加进 fund_scores（幂等 UPSERT），"
          echo "        使标签弹窗统一从 fund_scores 取基金 + 基金经理。"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          pip install requests
          python scripts/sync_etfs_to_fund_scores.py --workers 6 --delay 0.25
          echo "ETF/LOF 补充完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 数据更新通知
        if: ${{ failure() || cancelled() }}
        run: |
          echo "post-finalize job 失败或被取消！请检查 GitHub Actions 日志。"
          echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"

  # ───────────────────────────────────────────────────────────────
  # deploy：前端构建 + 部署 EdgeOne（依赖 post-finalize，if always()）
  # ───────────────────────────────────────────────────────────────
  deploy:
    needs: post-finalize
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 步骤6 — 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 步骤6a — 生成 .env（注入 Supabase 配置，Vite 构建时读取）
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env
          echo ".env 已生成:"
          cat .env | sed 's/=.*/=***/'

      - name: 步骤6b — 安装依赖并构建
        run: |
          echo "============================================"
          echo "  步骤6: 安装依赖 + 构建站点"
          echo "============================================"
          npm install
          npx vite build
          echo "构建完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤7 — 打包并部署到 EdgeOne Pages
        run: |
          echo "============================================"
          echo "  步骤7: 打包并部署到 EdgeOne Pages"
          echo "============================================"
          rm -rf dist/functions
          cp -r functions dist/functions
          echo '{"name":"dachu-pages-functions","version":"1.0.0","private":true}' > dist/package.json
          rm -f dist.zip
          cd dist && zip -r ../dist.zip . && cd ..
          npx edgeone pages deploy dist.zip -n dachu -a overseas -t "$EDGEONE_PAGES_API_TOKEN"
          echo "部署完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 部署通知
        if: ${{ failure() }}
        run: |
          echo "前端部署 job 失败！请检查 GitHub Actions 日志。"
          echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"
